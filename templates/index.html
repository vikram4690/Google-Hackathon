<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trip Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #e0eafc, #cfdef3);
            margin: 0;
            padding: 1em;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 2em auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2em 2.5em;
        }

        h1 {
            text-align: center;
            color: #2d6cdf;
            margin-bottom: 1.5em;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5em;
        }

        input,
        select {
            display: block;
            margin-bottom: 1.2em;
            width: 100%;
            padding: 0.6em;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            font-size: 1em;
            box-sizing: border-box;
        }

        button {
            padding: 0.8em 1.5em;
            border: none;
            border-radius: 8px;
            background: #2d6cdf;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            margin-right: 0.5em;
            margin-top: 0.5em;
            transition: background 0.2s;
        }

        button:hover {
            background: #1b4fa0;
        }

        button:disabled {
            background: #9db2d4;
            cursor: not-allowed;
        }

        .result {
            margin-top: 2em;
        }

        .day-plan {
            background: #f4f8fb;
            padding: 1.5em;
            margin-bottom: 1.5em;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .day-plan h3 {
            color: #1b4fa0;
            margin-top: 0;
            border-bottom: 2px solid #dde6f1;
            padding-bottom: 0.5em;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            margin-bottom: 1em;
        }

        li strong {
            color: #2d6cdf;
        }

        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #1b4fa0;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI Trip Planner for India</h1>
        <form action="/plan" method="post" id="tripForm">
            <label>Starting Point:</label>
            <input type="text" id="source" required placeholder="e.g., Delhi">

            <label>Destination:</label>
            <input type="text" id="destination" required placeholder="e.g., Mumbai">

            <div class="date-group">
                <div>
                    <label>Start Date:</label>
                    <input type="date" id="start_date" required>
                </div>
                <div>
                    <label>Return Date:</label>
                    <input type="date" id="return_date" required>
                </div>
            </div>

            <label>Budget (INR):</label>
            <input type="number" id="budget" required placeholder="e.g., 50000">

            <label>Interests:</label>
            <div class="interests-container">
                <label><input type="checkbox" name="interests" value="heritage"> Heritage</label>
                <label><input type="checkbox" name="interests" value="adventure"> Adventure</label>
                <label><input type="checkbox" name="interests" value="nightlife"> Nightlife</label>
                <label><input type="checkbox" name="interests" value="nature"> Nature</label>
                <label><input type="checkbox" name="interests" value="spiritual"> Spiritual</label>
                <label><input type="checkbox" name="interests" value="food"> Food</label>
                <label><input type="checkbox" name="interests" value="shopping"> Shopping</label>
                <label><input type="checkbox" name="interests" value="relaxation"> Relaxation</label>
            </div>

            <label>Primary Mode of Transport:</label>
            <select id="transport_mode">
                <option value="airplane">Airplane</option>
                <option value="train">Train</option>
                <option value="bus">Bus</option>
                <option value="personal_vehicle">Personal Vehicle</option>
            </select>

            <label>Language for Itinerary:</label>
            <select id="language">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Assamese">Assamese</option>
                <option value="Bengali">Bengali</option>
                <option value="Bodo">Bodo</option>
                <option value="Dogri">Dogri</option>
                <option value="Gujarati">Gujarati</option>
                <option value="Kannada">Kannada</option>
                <option value="Kashmiri">Kashmiri</option>
                <option value="Konkani">Konkani</option>
                <option value="Maithili">Maithili</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Manipuri">Manipuri</option>
                <option value="Marathi">Marathi</option>
                <option value="Nepali">Nepali</option>
                <option value="Odia">Odia</option>
                <option value="Punjabi">Punjabi</option>
                <option value="Sanskrit">Sanskrit</option>
                <option value="Santali">Santali</option>
                <option value="Sindhi">Sindhi</option>
                <option value="Tamil">Tamil</option>
                <option value="Telugu">Telugu</option>
                <option value="Urdu">Urdu</option>
            </select>

            <label>Additional Requirements:</label>
            <textarea id="additional_reqs" rows="3"
                placeholder="e.g., I need wheelchair accessibility, prefer vegetarian food, etc."></textarea>

            <button type="submit" id="submitBtn">Get Itinerary</button>
        </form>

        <div id="loading" style="display:none;">Generating your personalized itinerary...</div>
    </div>
    <script>
        const tripForm = document.querySelector('form');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');

        tripForm.addEventListener('submit', function () {
            // This code runs when the user clicks the submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...'; // Optional: Change button text
            loadingDiv.style.display = 'block';
        });
    </script>
</body>

</html>
